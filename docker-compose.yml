services:
  app:
    build: .
    ports: ["8000:8000"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://qvp:qvp@postgres:5432/qvp
      REDIS_URL: redis://redis:6379/0
      OPENSERP_BASE_URL: http://openserp:7000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: qvp
      POSTGRES_PASSWORD: qvp
      POSTGRES_DB: qvp
    ports: ["5432:5432"]
    volumes: ["pg_data:/var/lib/postgresql/data"]
    command: ["postgres", "-c", "wal_level=replica"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qvp -d qvp"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4
    ports: ["6379:6379"]
    volumes: ["redis_data:/data"]

  openserp:
    image: karust/openserp:latest
    command: ["serve", "-a", "0.0.0.0", "-p", "7000"]
    ports: ["7001:7000"]

volumes:
  pg_data:
  redis_data:
